name: Source and research checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-release.py
      - run: sh -n start.sh stop.sh scripts/setup.sh
      - run: sh scripts/setup.sh && docker compose config --quiet
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/requirements.lock pytest pytest-asyncio
      - run: pip install --no-deps -e services/paperflow
      - run: pytest -q services/tests
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf ghostscript fonts-noto-cjk
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm rebuild better-sqlite3 thesidedoor-flock
      - run: npm run postinstall
      - run: npm run ci
        env:
          RESEARCH_LOCAL_MODE: '1'
          NEXT_TELEMETRY_DISABLED: '1'
